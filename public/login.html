<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - رفيق رمضان</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <style>
        .auth-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
            padding: 20px;
        }

        .auth-card {
            background-color: var(--card-light);
            padding: 30px;
            border-radius: 20px;
            box-shadow: var(--shadow-main);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        body.dark-mode .auth-card {
            background-color: var(--card-dark);
        }

        .auth-logo {
            color: var(--primary-color);
            font-size: 3rem;
            margin-bottom: 20px;
        }

        .auth-title {
            font-family: var(--font-heading);
            font-size: 2rem;
            margin-bottom: 30px;
            color: var(--primary-color);
        }

        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            opacity: 0.8;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            background-color: var(--bg-light);
            color: var(--text-light);
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            transition: border-color 0.3s;
            text-align: right;
        }

        body.dark-mode .form-group input {
            background-color: var(--bg-dark);
            color: var(--text-dark);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .auth-btn {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: var(--primary-color);
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
            font-family: 'Cairo', sans-serif;
        }

        .auth-btn:hover {
            background: var(--primary-dark);
        }

        .toggle-text {
            margin-top: 20px;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .toggle-link {
            color: var(--primary-color);
            cursor: pointer;
            font-weight: 600;
            text-decoration: underline;
        }

        .error-msg {
            color: #ef4444;
            /* Red 500 */
            margin-bottom: 15px;
            font-size: 0.9rem;
            display: none;
        }

        .success-msg {
            color: #10B981;
            /* Green 500 */
            margin-bottom: 15px;
            font-size: 0.9rem;
            display: none;
        }
    </style>
</head>

<body class="dark-mode">
    <div class="app-container">
        <header class="app-header">
            <div class="logo">
                <i class="fa-solid fa-moon"></i>
                <h1>رفيق رمضان</h1>
            </div>
            <button id="theme-toggle" class="icon-btn" aria-label="تغيير المظهر">
                <i class="fa-solid fa-sun"></i>
            </button>
        </header>

        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-logo">
                    <i class="fa-solid fa-mosque"></i>
                </div>
                <h2 id="form-title" class="auth-title">تسجيل الدخول</h2>

                <div id="error-msg" class="error-msg"></div>
                <div id="success-msg" class="success-msg"></div>

                <form id="auth-form">
                    <div class="form-group">
                        <label for="username">اسم المستخدم</label>
                        <input type="text" id="username" required placeholder="ادخل اسم المستخدم">
                    </div>
                    <div class="form-group">
                        <label for="password">كلمة المرور</label>
                        <input type="password" id="password" required placeholder="ادخل كلمة المرور">
                    </div>
                    <button type="submit" class="auth-btn" id="submit-btn">دخول</button>
                </form>

                <p class="toggle-text">
                    <span id="toggle-question">ليس لديك حساب؟</span>
                    <span id="toggle-link" class="toggle-link">إنشاء حساب جديد</span>
                </p>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
    <script>
        // Theme Toggle Logic (copied primarily from script.js just for this page)
        const themeToggleBtn = document.getElementById('theme-toggle');
        const body = document.body;

        // Check saved theme
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') {
            body.classList.remove('dark-mode');
            themeToggleBtn.innerHTML = '<i class="fa-solid fa-moon"></i>';
        }

        themeToggleBtn.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            const isDark = body.classList.contains('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeToggleBtn.innerHTML = isDark ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
        });

        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('SW registered'))
                    .catch(err => console.log('SW fail', err));
            });
        }
    </script>
</body>

</html>
