<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - رفيق رمضان 🌙</title>
    <meta name="description" content="سجّل دخولك لرفيق رمضان">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(155deg, #0f172a 0%, #1a2d3a 50%, #0d2118 100%);
            position: relative;
            overflow: hidden;
        }

        /* Decorative circles */
        body::before {
            content: '';
            position: fixed;
            top: -120px;
            right: -120px;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.18) 0%, transparent 65%);
            border-radius: 50%;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -80px;
            left: -80px;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.1) 0%, transparent 65%);
            border-radius: 50%;
            pointer-events: none;
        }

        /* ===== Top Bar ===== */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            z-index: 100;
        }

        .app-brand {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #10B981;
            font-family: 'Amiri', serif;
            font-size: 1.2rem;
            font-weight: 700;
        }

        .app-brand i {
            font-size: 1.3rem;
        }

        .theme-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.25s;
        }

        .theme-btn:hover {
            background: rgba(255, 255, 255, 0.14);
            color: #f8fafc;
        }

        /* ===== Card ===== */
        .auth-card {
            background: rgba(30, 41, 59, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.07);
            padding: 36px 28px;
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            position: relative;
            z-index: 1;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            20% {
                transform: translateX(-8px);
            }

            40% {
                transform: translateX(8px);
            }

            60% {
                transform: translateX(-5px);
            }

            80% {
                transform: translateX(5px);
            }
        }

        /* Logo */
        .logo-wrap {
            width: 76px;
            height: 76px;
            background: linear-gradient(135deg, #10B981, #059669);
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4);
        }

        .logo-wrap i {
            font-size: 2rem;
            color: white;
        }

        .card-title {
            font-family: 'Amiri', serif;
            font-size: 1.9rem;
            font-weight: 700;
            color: #f8fafc;
            text-align: center;
            margin-bottom: 4px;
        }

        .card-subtitle {
            text-align: center;
            font-size: 0.9rem;
            color: #64748b;
            margin-bottom: 26px;
        }

        /* Messages */
        .error-msg {
            color: #fca5a5;
            font-size: 0.92rem;
            display: none;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.25);
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 14px;
            text-align: right;
        }

        .success-msg {
            color: #6ee7b7;
            font-size: 0.92rem;
            display: none;
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.25);
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 14px;
            text-align: right;
        }

        /* Form */
        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-bottom: 8px;
            font-size: 0.95rem;
            color: #94a3b8;
            font-weight: 600;
        }

        .form-group label i {
            color: #10B981;
            font-size: 0.85rem;
        }

        .input-wrap {
            position: relative;
        }

        .form-group input {
            width: 100%;
            padding: 13px 16px;
            border-radius: 12px;
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.05);
            color: #f8fafc;
            font-size: 1rem;
            font-family: 'Cairo', sans-serif;
            transition: border-color 0.3s, box-shadow 0.3s;
            text-align: right;
            direction: rtl;
        }

        .form-group input::placeholder {
            color: #475569;
            font-size: 0.9rem;
        }

        .form-group input:focus {
            outline: none;
            border-color: #10B981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
            background: rgba(16, 185, 129, 0.06);
        }

        /* Password input needs left padding for eye icon */
        #password {
            padding-left: 46px;
        }

        /* ===== Eye Button ===== */
        #eye-btn {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            font-size: 1rem;
            padding: 6px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
            z-index: 5;
            line-height: 1;
        }

        #eye-btn:hover {
            color: #10B981;
        }

        /* Submit Button */
        #submit-btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #10B981, #059669);
            color: white;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
            box-shadow: 0 5px 20px rgba(16, 185, 129, 0.35);
            transition: all 0.3s;
        }

        #submit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(16, 185, 129, 0.45);
        }

        #submit-btn:disabled {
            opacity: 0.72;
            cursor: not-allowed;
        }

        /* Toggle */
        .toggle-text {
            margin-top: 20px;
            text-align: center;
            font-size: 0.95rem;
            color: #64748b;
        }

        #toggle-link {
            color: #10B981;
            cursor: pointer;
            font-weight: 700;
            margin-right: 4px;
            transition: color 0.2s;
        }

        #toggle-link:hover {
            color: #34d399;
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <!-- Top Bar -->
    <div class="top-bar">
        <button class="theme-btn" id="theme-btn" title="تغيير المظهر">
            <i class="fa-solid fa-sun" id="theme-icon"></i>
        </button>
        <div class="app-brand">
            رفيق رمضان
            <i class="fa-solid fa-moon"></i>
        </div>
    </div>

    <!-- Auth Card -->
    <div class="auth-card">
        <div class="logo-wrap">
            <i class="fa-solid fa-mosque"></i>
        </div>

        <h1 id="form-title" class="card-title">تسجيل الدخول</h1>
        <p class="card-subtitle">أهلاً بك في رفيق رمضان 🌙</p>

        <div id="error-msg" class="error-msg"></div>
        <div id="success-msg" class="success-msg"></div>

        <form id="auth-form" novalidate>
            <!-- Username -->
            <div class="form-group">
                <label for="username">
                    <i class="fa-solid fa-user"></i>
                    اسم المستخدم
                </label>
                <input type="text" id="username" placeholder="ادخل اسم المستخدم" autocomplete="username" required>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">
                    <i class="fa-solid fa-lock"></i>
                    كلمة المرور
                </label>
                <div class="input-wrap">
                    <input type="password" id="password" placeholder="كلمة المرور (6 أحرف على الأقل)"
                        autocomplete="current-password" required>
                    <button type="button" id="eye-btn" aria-label="إظهار/إخفاء كلمة المرور">
                        <i class="fa-solid fa-eye" id="eye-icon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" id="submit-btn">
                <i class="fa-solid fa-right-to-bracket"></i>
                دخول
            </button>
        </form>

        <p class="toggle-text">
            <span id="toggle-question">ليس لديك حساب؟</span>
            <span id="toggle-link">إنشاء حساب جديد</span>
        </p>
    </div>

    <!-- Load auth logic AFTER DOM is ready -->
    <script src="auth.js"></script>
    <script>
        // ===== Eye Icon Toggle =====
        const eyeBtn = document.getElementById('eye-btn');
        const passInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eye-icon');

        eyeBtn.addEventListener('click', function (e) {
            e.preventDefault();
            e.stopPropagation();
            const isPass = passInput.type === 'password';
            passInput.type = isPass ? 'text' : 'password';
            eyeIcon.className = isPass ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
            passInput.focus();
        });

        // ===== Theme Toggle =====
        const themeBtn = document.getElementById('theme-btn');
        const themeIcon = document.getElementById('theme-icon');
        let isDark = localStorage.getItem('theme') !== 'light';

        function applyTheme() {
            if (isDark) {
                document.body.style.background = 'linear-gradient(155deg, #0f172a 0%, #1a2d3a 50%, #0d2118 100%)';
                themeIcon.className = 'fa-solid fa-sun';
            } else {
                document.body.style.background = 'linear-gradient(155deg, #e0fdf4 0%, #f0fdf4 50%, #dcfce7 100%)';
                themeIcon.className = 'fa-solid fa-moon';
            }
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        // Apply on load
        if (localStorage.getItem('theme') === 'light') {
            isDark = false;
            applyTheme();
        }

        themeBtn.addEventListener('click', () => {
            isDark = !isDark;
            applyTheme();
        });

        // ===== Service Worker =====
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(() => { });
        }
    </script>
</body>

</html>
